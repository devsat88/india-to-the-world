# Rebuilds the site just after midnight in India, so the static feed and the
# day the Today page is built with move on. Needs a DEPLOY_HOOK secret: the
# Vercel deploy hook URL for this project (Settings > Git > Deploy Hooks).
name: Daily rebuild
on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "DEPLOY_HOOK is not set; skipping"; fi
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK }}
