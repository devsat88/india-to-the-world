# Rebuilds the site just after midnight in India, so the static feed and the
# day the Today page is built with move on. Needs a CF_DEPLOY_HOOK secret: the
# Cloudflare Pages deploy hook URL for this project.
name: Daily rebuild
on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "CF_DEPLOY_HOOK is not set; skipping"; fi
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
